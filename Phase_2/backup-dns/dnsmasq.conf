# Backup DNS resolver (runs on Mac 2 = Mukul's laptop, in a container).
# Same admv.test records as Vaibhav's primary, so clients keep resolving if
# the primary (Mac 1) goes down.
listen-address=0.0.0.0
local=/admv.test/
host-record=app.admv.test,10.7.25.158
host-record=api.admv.test,10.7.25.158
local-ttl=30
no-resolv
server=8.8.8.8
server=1.1.1.1
domain-needed
bogus-priv
log-queries
log-facility=-
