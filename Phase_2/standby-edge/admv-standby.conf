# Standby edge (Extension E) — runs on a SECOND machine (e.g. Vaibhav's laptop).
# Identical to the primary edge, but:
#   - proxies to the backends over the LAN (10.7.25.158:3001/3002)
#   - tags responses X-Edge "standby" so you can tell which edge served
# Clients already trust the admv Local CA, and this serves the SAME cert, so no
# new trust step is needed.

upstream admv_backends_standby {
    server 10.7.25.158:3001 max_fails=1 fail_timeout=10s;   # Backend A (over LAN)
    server 10.7.25.158:3002 max_fails=1 fail_timeout=10s;   # Backend B (over LAN)
}

server {
    listen 80;
    server_name app.admv.test api.admv.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.admv.test api.admv.test;

    # copy server.crt / server.key from the primary edge to these paths:
    ssl_certificate     /opt/homebrew/etc/nginx/certs/server.crt;
    ssl_certificate_key /opt/homebrew/etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://admv_backends_standby;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503;

        add_header X-Edge "standby" always;          # <-- primary says "mac2"
        add_header X-Upstream $upstream_addr always;
    }
}
