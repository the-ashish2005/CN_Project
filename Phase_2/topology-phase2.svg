<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#33414f"/>
    </marker>
    <marker id="arrowO" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b4690e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="820" fill="#ffffff"/>
  <text x="590" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0b3d66">Team admv — Phase 2 Topology (admv.test)</text>
  <text x="590" y="55" text-anchor="middle" font-size="12" fill="#667">Client → DNS → HTTPS nginx edge → Backend A | B,  hardened with backup DNS, firewall isolation, HA failover &amp; a standby edge</text>

  <!-- ===== CLIENT ===== -->
  <rect x="460" y="76" width="260" height="56" rx="10" fill="#eef1f4" stroke="#5b6b7b" stroke-width="1.5"/>
  <text x="590" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#2b3a47">CLIENT (any team Mac)</text>
  <text x="590" y="119" text-anchor="middle" font-size="11" fill="#445">browser / curl · resolvers: primary + backup</text>

  <!-- ===== DNS (left) ===== -->
  <rect x="60" y="180" width="300" height="82" rx="10" fill="#e6f4ec" stroke="#1b7f4b" stroke-width="1.8"/>
  <text x="76" y="203" font-size="14" font-weight="700" fill="#1b7f4b">Primary DNS — Vaibhav</text>
  <text x="76" y="222" font-size="11" fill="#2f4f3e">Mac 1 · 10.7.3.140 · dnsmasq :53</text>
  <text x="76" y="240" font-size="11" fill="#2f4f3e">app/api.admv.test → edge · TTL 30</text>
  <text x="76" y="256" font-size="10" fill="#1b7f4b" font-style="italic">like Route 53</text>

  <rect x="60" y="286" width="300" height="78" rx="10" fill="#f3faf6" stroke="#1b7f4b" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="76" y="309" font-size="13" font-weight="700" fill="#1b7f4b">Backup DNS — Dikshant <tspan fill="#b4690e">(Ext A)</tspan></text>
  <text x="76" y="327" font-size="11" fill="#2f4f3e">Mac 4 · 10.7.24.165 · dnsmasq :53</text>
  <text x="76" y="344" font-size="11" fill="#2f4f3e">same records — used if primary dies</text>

  <!-- ===== EDGE row ===== -->
  <rect x="450" y="200" width="300" height="96" rx="10" fill="#e3eef7" stroke="#0b3d66" stroke-width="1.8"/>
  <text x="466" y="223" font-size="14" font-weight="700" fill="#0b3d66">Primary Edge — Mukul</text>
  <text x="466" y="242" font-size="11" fill="#20364a">Mac 2 · 10.7.25.158 · nginx</text>
  <text x="466" y="259" font-size="11" fill="#20364a">TLS term · HTTP/2 · round-robin LB</text>
  <text x="466" y="276" font-size="11" fill="#20364a">:80→:443 redirect · X-Edge: mac2</text>
  <text x="466" y="291" font-size="10" fill="#0b3d66" font-style="italic">like a cloud load balancer / CDN edge</text>

  <rect x="820" y="200" width="300" height="96" rx="10" fill="#eef4fa" stroke="#0b3d66" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="836" y="223" font-size="13" font-weight="700" fill="#0b3d66">Standby Edge — Dikshant <tspan fill="#b4690e">(Ext E)</tspan></text>
  <text x="836" y="242" font-size="11" fill="#20364a">Mac 4 · nginx :443 · same cert</text>
  <text x="836" y="259" font-size="11" fill="#20364a">X-Edge: standby</text>
  <text x="836" y="276" font-size="11" fill="#20364a">DNS cutover target (TTL migration)</text>

  <!-- ===== BACKEND row ===== -->
  <rect x="420" y="430" width="300" height="94" rx="10" fill="#f0e9f8" stroke="#6b3fa0" stroke-width="1.8"/>
  <text x="436" y="453" font-size="14" font-weight="700" fill="#6b3fa0">Backend A — Ashish</text>
  <text x="436" y="472" font-size="11" fill="#432a5e">Mac 3 · 10.7.29.240:3001 · REST API</text>
  <text x="436" y="489" font-size="11" fill="#432a5e">X-Backend: A</text>
  <text x="436" y="508" font-size="10" fill="#b4690e" font-style="italic">🔒 pf firewall: only the edge may connect (Ext C)</text>

  <rect x="820" y="430" width="300" height="94" rx="10" fill="#f0e9f8" stroke="#6b3fa0" stroke-width="1.8"/>
  <text x="836" y="453" font-size="14" font-weight="700" fill="#6b3fa0">Backend B — Dikshant</text>
  <text x="836" y="472" font-size="11" fill="#432a5e">Mac 4 · 10.7.24.165:3002 · REST API</text>
  <text x="836" y="489" font-size="11" fill="#432a5e">X-Backend: B</text>
  <text x="836" y="508" font-size="10" fill="#b4690e" font-style="italic">🔒 pf firewall: only the edge may connect (Ext C)</text>

  <!-- ===== ARROWS ===== -->
  <!-- client -> primary DNS -->
  <line x1="470" y1="96" x2="352" y2="186" stroke="#33414f" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="372" y="150" font-size="11" fill="#33414f" font-weight="600">① DNS query :53</text>
  <!-- client -> backup DNS (dashed) -->
  <line x1="466" y1="112" x2="352" y2="300" stroke="#b4690e" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowO)"/>
  <text x="300" y="250" font-size="10" fill="#b4690e" transform="rotate(58 300 250)">failover</text>
  <!-- client -> primary edge -->
  <line x1="595" y1="132" x2="600" y2="196" stroke="#33414f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="610" y="168" font-size="11" fill="#33414f" font-weight="600">② HTTPS :443 (TLS, HTTP/2)</text>
  <!-- client -> standby edge (dashed) -->
  <path d="M720,104 C 880,120 970,150 970,196" fill="none" stroke="#b4690e" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowO)"/>
  <text x="840" y="128" font-size="10" fill="#b4690e" font-weight="600">DNS cutover (Ext E)</text>
  <!-- primary edge -> backend A -->
  <line x1="575" y1="296" x2="570" y2="426" stroke="#33414f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="430" y="360" font-size="11" fill="#33414f" font-weight="600">③ proxy + round-robin LB</text>
  <!-- primary edge -> backend B -->
  <line x1="660" y1="296" x2="900" y2="426" stroke="#33414f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="690" y="360" font-size="10" fill="#33414f">failover if A down (Ext D)</text>
  <!-- standby edge -> backends (faint dashed) -->
  <line x1="950" y1="296" x2="900" y2="426" stroke="#9aa6b2" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <line x1="880" y1="296" x2="640" y2="426" stroke="#9aa6b2" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- ===== LEGEND ===== -->
  <rect x="60" y="560" width="1060" height="226" rx="10" fill="#fafbfc" stroke="#d0d7de" stroke-width="1"/>
  <text x="80" y="586" font-size="14" font-weight="700" fill="#0b3d66">Phase 2 hardening — what each extension adds</text>

  <text x="80" y="614" font-size="12" fill="#222"><tspan font-weight="700" fill="#1b7f4b">A · Backup DNS</tspan>  2nd resolver (Dikshant); client fails over when Vaibhav's primary is stopped. ✓ demonstrated</text>
  <text x="80" y="638" font-size="12" fill="#222"><tspan font-weight="700" fill="#1b7f4b">B · DNS TTL cutover</tspan>  short TTL; client serves cached answer until it expires, then the new one; flush = instant. ✓ demonstrated</text>
  <text x="80" y="662" font-size="12" fill="#222"><tspan font-weight="700" fill="#6b3fa0">C · Service isolation</tspan>  pf rules on BOTH backends — only the edge (10.7.25.158) may reach :3001/:3002; others refused. ✓ confirmed</text>
  <text x="80" y="686" font-size="12" fill="#222"><tspan font-weight="700" fill="#0b3d66">D · HA failover</tspan>  nginx health checks route around a dead backend; 502 only if both are down. ✓ demonstrated</text>
  <text x="80" y="710" font-size="12" fill="#222"><tspan font-weight="700" fill="#0b3d66">E · Edge migration</tspan>  standby nginx (Dikshant); DNS repointed to it — mitigates the edge single-point-of-failure. ✓ demonstrated</text>
  <text x="80" y="734" font-size="12" fill="#222"><tspan font-weight="700" fill="#b4690e">F · Troubleshooting</tspan>  layered diagnosis ladder: DNS → TCP → TLS → HTTP. ✓ prepared for live fault injection</text>
  <text x="80" y="762" font-size="11" fill="#667" font-style="italic">Note: all four roles now run on real laptops on the LAN. Dikshant's Mac 4 additionally hosts the backup DNS (A) and standby edge (E). Both backends are firewall-isolated to the edge (C).</text>

  <!-- flow legend -->
  <line x1="820" y1="596" x2="860" y2="596" stroke="#33414f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="868" y="600" font-size="11" fill="#445">primary path</text>
  <line x1="990" y1="596" x2="1030" y2="596" stroke="#b4690e" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowO)"/>
  <text x="1038" y="600" font-size="11" fill="#445">resilient path</text>
</svg>
