# ---------------------------------------------------------------------------
# STANDBY EDGE (Extension E)  —  Dikshant's laptop (Mac 4, 10.7.24.165)
#
# A second, independent nginx carrying the SAME certificate, so that DNS can
# move traffic to it without any client re-trusting anything. It exists to
# mitigate the single point of failure identified in Extension D: the primary
# edge on Mac 2.
#
# Install:  cp config/nginx-standby.conf $(brew --prefix)/etc/nginx/servers/admv.conf
#           copy server.crt + server.key across from the primary edge
#           sudo nginx -t && sudo nginx
#
# >>> CORRECTED vs. the original Phase 2 draft <<<
# The earlier version pointed this upstream at 10.7.25.158:3001/3002 — that is
# the PRIMARY EDGE's address, not a backend. A standby whose upstreams live on
# the machine it is replacing is useless: if Mac 2 dies, the standby proxies
# into the same dead host. The pool below addresses the REAL backends.
# ---------------------------------------------------------------------------

upstream admv_backends_standby {
    server 10.7.29.240:3001 max_fails=1 fail_timeout=10s;   # Backend A — Ashish, over the LAN
    server 127.0.0.1:3002   max_fails=1 fail_timeout=10s;   # Backend B — same laptop, via loopback
}

server {
    listen 80;
    server_name app.admv.test api.admv.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.admv.test api.admv.test;

    # SAME certificate as the primary edge. The cert is bound to the NAME
    # app.admv.test, not to an IP, which is precisely why a DNS-based cutover
    # works with no new trust step on the clients.
    ssl_certificate     /opt/homebrew/etc/nginx/certs/server.crt;
    ssl_certificate_key /opt/homebrew/etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://admv_backends_standby;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503;

        # The tell-tale: primary says "primary-mac2", this one says "standby".
        # That single header is how the cutover is proven in the demo.
        add_header X-Edge     "standby"      always;
        add_header X-Upstream $upstream_addr always;
    }
}
