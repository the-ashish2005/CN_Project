# ---------------------------------------------------------------------------
# PRIMARY EDGE — Phase 1  (Mukul's laptop, Mac 2, 10.7.25.158)
# Install: cp config/nginx-phase1.conf $(brew --prefix)/etc/nginx/servers/admv.conf
#          sudo nginx -t && sudo nginx
#
# This is the single front door. Clients never address a backend directly;
# they only ever know the name app.admv.test, which DNS maps to THIS machine.
# ---------------------------------------------------------------------------

# ---------- The backend pool (Task D) ----------
# Default balancing method is round-robin: request 1 -> A, request 2 -> B, ...
# That is what makes the X-Backend header alternate in the demo.
upstream admv_backends {
    server 10.7.29.240:3001 max_fails=1 fail_timeout=10s;   # Backend A — Ashish  (Mac 3)
    server 10.7.24.165:3002 max_fails=1 fail_timeout=10s;   # Backend B — Dikshant (Mac 4)
}

# ---------- Port 80: redirect plain HTTP to HTTPS ----------
# 301 so a client that types http:// is moved to TLS instead of being served
# in the clear. Demonstrates that the edge, not the backend, enforces policy.
server {
    listen 80;
    server_name app.admv.test api.admv.test;
    return 301 https://$host$request_uri;
}

# ---------- Port 443: TLS termination + reverse proxy ----------
server {
    listen 443 ssl;
    http2 on;                      # requires nginx >= 1.25.1 (check: nginx -v)
    server_name app.admv.test api.admv.test;

    # TLS is TERMINATED here: nginx decrypts, then talks plain HTTP to the
    # backends on the trusted LAN. This is why the backends need no certificates.
    ssl_certificate     /opt/homebrew/etc/nginx/certs/server.crt;
    ssl_certificate_key /opt/homebrew/etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://admv_backends;

        # Preserve the client's view of the request for the backend.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Passive health checking (Task D / Extension D):
        # a 2s connect timeout means a dead laptop is detected fast, and
        # proxy_next_upstream silently retries the request on the other backend
        # so the client never sees the failure.
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503;

        # Evidence headers — which edge served it, and which upstream it chose.
        add_header X-Edge     "primary-mac2"  always;
        add_header X-Upstream $upstream_addr  always;
    }
}
