# ---------------------------------------------------------------------------
# BACKUP private DNS resolver (Extension A)
#   Runs on Dikshant's laptop (Mac 4, 10.7.24.165) — deliberately NOT Mac 1,
#   so that losing Mac 1 does not take DNS with it.
#
# Identical records to the primary. The ONLY difference is which machine it
# runs on; a resolver is only redundant if it fails independently.
#
# Clients list both:
#   sudo networksetup -setdnsservers Wi-Fi 10.7.3.140 10.7.24.165
# The OS tries the first, and falls through to the second when it times out.
# ---------------------------------------------------------------------------
listen-address=0.0.0.0
bind-interfaces

local=/admv.test/
host-record=app.admv.test,10.7.25.158
host-record=api.admv.test,10.7.25.158
local-ttl=30

no-resolv
server=8.8.8.8
server=1.1.1.1
domain-needed
bogus-priv

log-queries
log-facility=/tmp/dnsmasq-backup.log
