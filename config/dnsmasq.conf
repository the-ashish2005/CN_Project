# ---------------------------------------------------------------------------
# PRIMARY private DNS resolver  —  Vaibhav's laptop (Mac 1, 10.7.3.140)
# Install:  cp config/dnsmasq.conf $(brew --prefix)/etc/dnsmasq.conf
#           $(brew --prefix)/sbin/dnsmasq --test
#           sudo brew services start dnsmasq
# ---------------------------------------------------------------------------

# Answer on every interface, not just loopback, so the other laptops can query us.
listen-address=0.0.0.0
bind-interfaces

# We are AUTHORITATIVE for admv.test. "local=" means: never forward these
# names upstream — if we don't know the answer, say NXDOMAIN rather than
# asking 8.8.8.8 (which would leak our private names to the internet).
local=/admv.test/

# The project records. Both names point at the EDGE, never at a backend:
# clients must always enter through nginx so TLS and load balancing apply.
host-record=app.admv.test,10.7.25.158
host-record=api.admv.test,10.7.25.158

# TTL = how long a client may cache our answer. 30s keeps Extension B's
# cutover demo short enough to show live.
local-ttl=30

# Everything that is NOT admv.test gets forwarded, so the laptops still have
# working internet while pointed at us.
no-resolv
server=8.8.8.8
server=1.1.1.1
domain-needed
bogus-priv

# Query log — the per-request evidence for Task B.
log-queries
log-facility=/tmp/dnsmasq.log
